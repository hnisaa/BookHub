<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitaplar – BookHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .page-head { padding: 40px 0 8px; }
    .seg { display: inline-flex; padding: 4px; background: var(--paper-2); border-radius: 999px; gap: 2px; }
    .seg button { border: 0; background: none; padding: 8px 16px; border-radius: 999px; font: 600 .9rem var(--sans); color: var(--ink-2); cursor: pointer; }
    .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .filters { display: grid; gap: 12px; grid-template-columns: auto 1fr 200px 200px; align-items: center; margin: 22px 0 28px; }
    @media (max-width: 860px) { .filters { grid-template-columns: 1fr 1fr; } .filters .seg, .filters .search { grid-column: 1 / -1; } .seg { justify-self: start; } }
    .result-info { color: var(--muted); font-size: .88rem; margin-bottom: 14px; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="page-head">
      <div class="eyebrow">Katalog</div>
      <h1 id="page-title">Tüm Kitaplar</h1>
    </div>

    <div class="filters">
      <div class="seg" id="seg">
        <button data-v="">Tümü</button>
        <button data-v="sifir">Sıfır</button>
        <button data-v="ikinci_el">İkinci El</button>
      </div>
      <input class="input search" id="q" type="search" placeholder="Kitap, yazar veya ISBN ara…" aria-label="Ara">
      <select class="input" id="cat" aria-label="Kategori"><option value="">Tüm kategoriler</option></select>
      <select class="input" id="sort" aria-label="Sırala">
        <option value="">En yeni</option>
        <option value="fiyat_artan">Fiyat: artan</option>
        <option value="fiyat_azalan">Fiyat: azalan</option>
        <option value="ad">Ada göre (A–Z)</option>
      </select>
    </div>

    <div class="result-info" id="info"></div>
    <div class="grid-books" id="list"></div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    (async function () {
      const { api, $, $$, esc, qs, bookCardHTML } = BH;
      const state = { durum: qs("durum") || "", kategori: qs("kategori") || "", q: qs("q") || "", sort: qs("sirala") || "" };
      const titles = { "": "Tüm Kitaplar", sifir: "Sıfır Kitaplar", ikinci_el: "İkinci El Kitaplar" };

      const cats = await api("/categories");
      $("#cat").insertAdjacentHTML("beforeend", cats.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join(""));
      $("#cat").value = state.kategori;
      $("#q").value = state.q;
      $("#sort").value = state.sort;

      async function load() {
        $$("#seg button").forEach((b) => b.classList.toggle("on", b.dataset.v === state.durum));
        $("#page-title").textContent = titles[state.durum] || titles[""];
        const params = new URLSearchParams();
        if (state.durum) params.set("condition", state.durum);
        if (state.kategori) params.set("category", state.kategori);
        if (state.q) params.set("q", state.q);
        if (state.sort) params.set("sort", state.sort);

        // adres çubuğunu da güncelle (paylaşılabilir bağlantı)
        const url = new URLSearchParams();
        for (const [k, v] of Object.entries({ durum: state.durum, kategori: state.kategori, q: state.q, sirala: state.sort })) if (v) url.set(k, v);
        history.replaceState(null, "", "/kitaplar.html" + (url.toString() ? "?" + url : ""));

        const books = await api("/books?" + params);
        $("#info").textContent = books.length + " kitap bulundu";
        $("#list").innerHTML = books.length
          ? books.map(bookCardHTML).join("")
          : '<div class="empty" style="grid-column:1/-1"><h3>Sonuç yok</h3><p>Filtreleri değiştirerek tekrar deneyin.</p></div>';
      }

      $("#seg").addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        state.durum = b.dataset.v; load();
      });
      $("#cat").addEventListener("change", (e) => { state.kategori = e.target.value; load(); });
      $("#sort").addEventListener("change", (e) => { state.sort = e.target.value; load(); });
      let t;
      $("#q").addEventListener("input", (e) => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value.trim(); load(); }, 250); });

      load();
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitaplar – BookHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .page-head { padding: 40px 0 8px; }
    .catalog { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 32px; align-items: start; }
    .side { position: sticky; top: 86px; max-height: calc(100vh - 106px); overflow-y: auto; padding: 14px 10px; }
    .side h3 { margin: 0 8px 8px; font-size: 1.1rem; }
    .side .all-link { display: flex; justify-content: space-between; padding: 9px 12px; margin-bottom: 4px; border-radius: 8px; font-weight: 600; color: var(--ink-2); }
    .side .all-link:hover { background: var(--paper-2); color: var(--ink); }
    .side .all-link.active { background: var(--accent); color: var(--accent-ink); }
    .side .all-link span { font-size: .8rem; opacity: .8; }
    .seg { display: inline-flex; padding: 4px; background: var(--paper-2); border-radius: 999px; gap: 2px; }
    .seg button { border: 0; background: none; padding: 8px 16px; border-radius: 999px; font: 600 .9rem var(--sans); color: var(--ink-2); cursor: pointer; }
    .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .filters { display: grid; gap: 12px; grid-template-columns: auto 1fr 190px; align-items: center; margin: 0 0 18px; }
    .mobile-cats { display: none; }
    .result-info { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: .88rem; margin-bottom: 14px; min-height: 30px; }
    .active-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 12px; border-radius: 999px; background: var(--paper-2); color: var(--ink); font-weight: 600; }
    .active-chip button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1rem; line-height: 1; padding: 2px 6px; border-radius: 999px; }
    .active-chip button:hover { color: var(--danger); }
    @media (max-width: 960px) {
      .catalog { grid-template-columns: 1fr; }
      .side { display: none; }
      .mobile-cats { display: inline-flex; }
      .filters { grid-template-columns: 1fr auto; }
      .filters .seg, .filters .search { grid-column: 1 / -1; }
      .seg { justify-self: start; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="page-head">
      <div class="eyebrow">Katalog</div>
      <h1 id="page-title">Tüm Kitaplar</h1>
    </div>

    <div class="catalog">
      <aside class="panel side" aria-label="Kategoriler">
        <h3>Kategoriler</h3>
        <a href="/kitaplar.html" class="all-link" data-cat="">Tüm kategoriler <span id="all-count"></span></a>
        <div id="side-menu"><div class="muted" style="padding:8px 12px">Yükleniyor…</div></div>
      </aside>

      <section>
        <div class="filters">
          <div class="seg" id="seg">
            <button data-v="">Tümü</button>
            <button data-v="sifir">Sıfır</button>
            <button data-v="ikinci_el">İkinci El</button>
          </div>
          <input class="input search" id="q" type="search" placeholder="Kitap, yazar veya ISBN ara…" aria-label="Ara">
          <button class="btn btn-ghost mobile-cats" type="button" data-open-cats>Kategoriler</button>
          <select class="input" id="sort" aria-label="Sırala">
            <option value="">En yeni</option>
            <option value="fiyat_artan">Fiyat: artan</option>
            <option value="fiyat_azalan">Fiyat: azalan</option>
            <option value="ad">Ada göre (A–Z)</option>
          </select>
        </div>

        <div class="result-info" id="info"></div>
        <div class="grid-books" id="list"></div>
      </section>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    (async function () {
      const { api, $, $$, esc, qs, bookCardHTML, loadCategories, categoryMenuHTML } = BH;
      const state = { durum: qs("durum") || "", kategori: Number(qs("kategori")) || null, q: qs("q") || "", sort: qs("sirala") || "" };
      const titles = { "": "Tüm Kitaplar", sifir: "Sıfır Kitaplar", ikinci_el: "İkinci El Kitaplar" };

      const cats = await loadCategories();
      const catName = (id) => (cats.find((c) => c.id === id) || {}).name;
      $("#all-count").textContent = cats.reduce((n, c) => n + c.count, 0);
      $("#side-menu").innerHTML = categoryMenuHTML(cats, { activeId: state.kategori, openFirst: true });
      $("#q").value = state.q;
      $("#sort").value = state.sort;

      function markActive() {
        $$(".side [data-cat]").forEach((a) => {
          const on = (Number(a.dataset.cat) || null) === state.kategori;
          a.classList.toggle("active", on);
          if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
          if (on) a.closest("details")?.setAttribute("open", "");
        });
      }

      async function load() {
        $$("#seg button").forEach((b) => b.classList.toggle("on", b.dataset.v === state.durum));
        const name = catName(state.kategori);
        $("#page-title").textContent = name || titles[state.durum] || titles[""];
        document.title = ($("#page-title").textContent) + " – BookHub";
        markActive();

        const params = new URLSearchParams();
        if (state.durum) params.set("condition", state.durum);
        if (state.kategori) params.set("category", state.kategori);
        if (state.q) params.set("q", state.q);
        if (state.sort) params.set("sort", state.sort);

        // adres çubuğunu da güncelle (paylaşılabilir bağlantı)
        const url = new URLSearchParams();
        for (const [k, v] of Object.entries({ durum: state.durum, kategori: state.kategori, q: state.q, sirala: state.sort })) if (v) url.set(k, v);
        history.replaceState(null, "", "/kitaplar.html" + (url.toString() ? "?" + url : ""));

        const books = await api("/books?" + params);
        $("#info").innerHTML = `<span>${books.length} kitap bulundu</span>`
          + (name ? `<span class="active-chip">${esc(name)}<button type="button" id="clear-cat" aria-label="Kategori filtresini kaldır">×</button></span>` : "");
        $("#list").innerHTML = books.length
          ? books.map(bookCardHTML).join("")
          : '<div class="empty" style="grid-column:1/-1"><h3>Sonuç yok</h3><p>Filtreleri değiştirerek tekrar deneyin.</p></div>';
      }

      // Kenar çubuğundaki kategori bağlantıları sayfayı yenilemeden filtreler
      $(".side").addEventListener("click", (e) => {
        const a = e.target.closest("a[data-cat]");
        if (!a) return;
        e.preventDefault();
        state.kategori = Number(a.dataset.cat) || null;
        load();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      $("#info").addEventListener("click", (e) => { if (e.target.id === "clear-cat") { state.kategori = null; load(); } });
      $("#seg").addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        state.durum = b.dataset.v; load();
      });
      $("#sort").addEventListener("change", (e) => { state.sort = e.target.value; load(); });
      let t;
      $("#q").addEventListener("input", (e) => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value.trim(); load(); }, 250); });

      load();
    })();
  </script>
</body>
</html>
